name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Depoyu Kopyala
      uses: actions/checkout@v4

    - name: Node.js Kurulumu
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Projeyi Hazırla ve Logoyu Entegre Et
      run: |
        mkdir -p www
        if [ -f "index.html" ]; then
          cp index.html www/index.html
        fi

        npm install
        npx cap add android || true
        
        if [ -f "icon.png" ]; then
          npm install -g @capacitor/assets
          npx @capacitor/assets generate --android || true
        elif [ -f "assets/icon.png" ]; then
          npm install -g @capacitor/assets
          npx @capacitor/assets generate --android || true
        fi
        
        npx cap update android
        npx cap sync android

    - name: İsmi ve Tüm İzinleri Sabitle
      run: |
        STRING_FILE="android/app/src/main/res/values/strings.xml"
        if [ -f "$STRING_FILE" ]; then
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Taksimetre Hesaplayici<\/string>/g' "$STRING_FILE"
        fi

        # Python kullanarak Manifest dosyasına izinleri güvenli bir şekilde ekliyoruz
        python3 -c '
        manifest_path = "android/app/src/main/AndroidManifest.xml"
        with open(manifest_path, "r", encoding="utf-8") as f:
            content = f.read()

        permissions = """
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-permission android:name="android.permission.READ_CONTACTS" />
            <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
            <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
            <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" />
        """

        if "<application" in content and "uses-permission" not in content:
            content = content.replace("<application", permissions + "\n    <application")
            with open(manifest_path, "w", encoding="utf-8") as f:
                f.write(content)
        '

    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: APK Derle ve Yeniden Adlandır
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
        cd ..
        cp android/app/build/outputs/apk/debug/app-debug.apk Taksimetre-Hesaplayici.apk

    - name: APK Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: Taksimetre-Hesaplayici
        path: Taksimetre-Hesaplayici.apk
        

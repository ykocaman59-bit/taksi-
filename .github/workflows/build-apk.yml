name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Kopyala
      uses: actions/checkout@v4

    - name: Node.js Kurulumu
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Capacitor Projesini Manuel ve Hatasız Hazırla
      run: |
        # Capacitor paketlerini projeye kuralım
        npm install @capacitor/core @capacitor/cli @capacitor/android

        # capacitor.config.json dosyasını doğrudan kendimiz oluşturalım (Web dizini kök klasör '.')
        echo '{
          "appId": "com.taksimetre.app",
          "appName": "TaksiAsistan",
          "webDir": ".",
          "bundledWebRuntime": false
        }' > capacitor.config.json

        # Android platformunu ekleyelim
        npx cap add android

    - name: Java (JDK 17) Kurulumu
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Android APK Derle (Debug)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: APK Dosyasını Kaydet ve İndirilebilir Yap
      uses: actions/upload-artifact@v4
      with:
        name: taksimetre-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        

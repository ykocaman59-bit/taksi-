name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
    build:
      runs-on: ubuntu-22.04

      steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Java (JDK 17) Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Projeyi Hazırla ve Derle
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          fi

          npm install @capacitor/core @capacitor/cli @capacitor/android

          echo '{
            "appId": "com.taksimetre.app",
            "appName": "TaksiAsistan",
            "webDir": "www",
            "bundledWebRuntime": false
          }' > capacitor.config.json

          npx cap add android
          npx cap sync android

          cd android
          chmod +x gradlew
          # Önbellek hatasını aşmak için bağımlılıkları zorla yenile
          ./gradlew assembleDebug --refresh-dependencies --no-daemon
          
      - name: APK Dosyasını Kaydet ve İndirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: taksimetre-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          

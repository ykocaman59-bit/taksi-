name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Kopyala
      uses: actions/checkout@v4

    - name: Node.js Kurulumu
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Dosya Yapısını Düzenle ve Capacitor'ı Hazırla
      run: |
        # Garantili olması için www klasörünü betik içinde oluşturalım
        mkdir -p www
        
        # Eğer kök dizinde index.html varsa www içine taşıyalım (zaten www içindeyse hata vermez)
        if [ -f "index.html" ]; then
          cp index.html www/index.html
        fi

        # Capacitor paketlerini kuralım
        npm install @capacitor/core @capacitor/cli @capacitor/android

        # capacitor.config.json dosyasını oluşturalım
        echo '{
          "appId": "com.taksimetre.app",
          "appName": "TaksiAsistan",
          "webDir": "www",
          "bundledWebRuntime": false
        }' > capacitor.config.json

        # Android platformunu ekleyip senkronize edelim
        npx cap add android
        npx cap sync android

    - name: Java (JDK 17) Kurulumu
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Android APK Derle (Debug)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: APK Dosyasını Kaydet ve İndirilebilir Yap
      uses: actions/upload-artifact@v4
      with:
        name: taksimetre-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Taksimetre</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #111; color: #fff; margin: 0; padding: 20px; }
        .meter-box { background: #222; border: 4px solid #f1c40f; border-radius: 15px; padding: 20px; max-width: 400px; margin: auto; box-shadow: 0 0 20px rgba(241, 196, 15, 0.5); }
        h1 { color: #f1c40f; font-size: 24px; }
        .screen { background: #000; color: #0f0; font-family: monospace; font-size: 36px; padding: 15px; border-radius: 8px; margin: 15px 0; border: 2px solid #333; }
        .label { font-size: 14px; color: #aaa; }
        button { background: #e74c3c; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        button.start { background: #2ecc71; }
    </style>
</head>
<body>

    <div class="meter-box">
        <h1>TAKSİMETRE</h1>
        
        <div class="label">TOPLAM ÜCRET</div>
        <div class="screen" id="totalPrice">50.00 ₺</div>

        <div class="label">MESAFE</div>
        <div id="distance" style="font-size: 20px; margin: 10px 0;">0.00 km</div>

        <button id="toggleBtn" class="start" onclick="toggleMeter()">BAŞLAT</button>
    </div>

    <script>
        let isRunning = false;
        let watchId = null;
        let totalKm = 0;
        let lastCoords = null;

        const openingFee = 50.00; // Açılış Ücreti
        const kmRate = 25.00;     // KM Başına Ücret

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Dünya yarıçapı (km)
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function toggleMeter() {
            const btn = document.getElementById('toggleBtn');
            if (!isRunning) {
                if (!navigator.geolocation) {
                    alert("Tarayıcınız konum desteklemiyor!");
                    return;
                }
                isRunning = true;
                btn.innerText = "DURDUR / BİTİR";
                btn.className = "";
                totalKm = 0;
                lastCoords = null;

                watchId = navigator.geolocation.watchPosition(successPosition, errorPosition, {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 5000
                });
            } else {
                isRunning = false;
                navigator.geolocation.clearWatch(watchId);
                btn.innerText = "BAŞLAT";
                btn.className = "start";
            }
        }

        function successPosition(position) {
            const currentCoords = {
                lat: position.coords.latitude,
                lon: position.coords.longitude
            };

            if (lastCoords) {
                const distance = calculateDistance(lastCoords.lat, lastCoords.lon, currentCoords.lat, currentCoords.lon);
                if (distance > 0.002) { // 2 metreden küçük hareketleri gürültü olarak yoksay
                    totalKm += distance;
                    lastCoords = currentCoords;
                }
            } else {
                lastCoords = currentCoords;
            }

            let currentPrice = openingFee + (totalKm * kmRate);
            document.getElementById('totalPrice').innerText = currentPrice.toFixed(2) + " ₺";
            document.getElementById('distance').innerText = totalKm.toFixed(2) + " km";
        }

        function errorPosition(error) {
            console.error("Konum alınamadı: " + error.message);
        }
    </script>
</body>
</html>
